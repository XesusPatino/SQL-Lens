<title>SQL Compare</title>
<style>

  --faint: #9aa1ae; --line: #e1e4ea; --hover: #eef1f6; --accent: #3457d5; --accent-soft: #e8edfd;
  --sombra: 0 1px 2px rgba(20,30,50,.06), 0 2px 8px rgba(20,30,50,.05);
  --a: #2f6fdb; --b: #b9620b; --dif: #7b4cd0;
  --add-bg: #e6f6ea; --add: #1d7a3a; --del-bg: #fdeaea; --del: #b42318;

}

  }
}
:root[data-theme="dark"] {
  --bg: #11141a; --panel: #191d25; --panel2: #1e232d; --text: #e5e8ee; --muted: #9ba3b4;
  --faint: #687084; --line: #2a303c; --hover: #232935; --accent: #7e98ff; --accent-soft: #232d4f;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

.barra {
  display: flex; align-items: center; gap: 16px; padding: 12px 24px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.barra strong { font-size: 15px; }
.barra span { color: var(--faint); font-size: 12px; }
main { max-width: 1800px; margin: 0 auto; padding: 24px 32px 72px; }

.lados { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.lado { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; border-top: 3px solid var(--c); }
.lado.a { --c: var(--a); } .lado.b { --c: var(--b); }
.lado .letra { font-weight: 700; color: var(--c); font-size: 13px; }
.lado .nombre { font: 600 16px/1.3 var(--mono); margin: 2px 0; word-break: break-all; }
.lado .fecha { color: var(--muted); font-size: 13px; }

.caja { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 16px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel2); }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
tr.total td { font-weight: 700; background: var(--panel2); }
td .num { border: 0; background: none; padding: 2px 6px; border-radius: 5px; font-weight: 600; }
td .num:hover { background: var(--hover); }
td .num.sel { background: var(--accent-soft); outline: 1px solid var(--accent); }
.col-a { color: var(--a); } .col-b { color: var(--b); } .col-dif { color: var(--dif); }
td .cero { color: var(--faint); }

.avisos p { margin: 0 0 10px; font-size: 13px; color: var(--muted); border-left: 3px solid var(--del); padding: 2px 0 2px 10px; }

.herramientas { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.herramientas h2 { font-size: 15px; margin: 0 8px 0 0; }
.herramientas input {
  flex: 1; min-width: 220px; max-width: 420px; padding: 7px 11px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--panel2); outline: none;
}
.herramientas input:focus { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 12px; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.boton { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 12px; min-height: 34px; }
.boton:hover { background: var(--hover); }
.herramientas .boton { margin-left: auto; }
.filtro-activo { font-size: 13px; color: var(--muted); }
.filtro-activo button { border: 0; background: none; color: var(--accent); padding: 0 4px; }

.fila { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--line); min-height: 38px; }
.fila.abrible { cursor: pointer; }
.fila.abrible:hover { background: var(--hover); }
.fila .nom { font: 12.5px/1.3 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila .fechas { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
.estado { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; flex: none; }
.estado.soloA { color: var(--a); background: color-mix(in srgb, var(--a) 13%, transparent); }
.estado.soloB { color: var(--b); background: color-mix(in srgb, var(--b) 13%, transparent); }
.estado.distinto { color: var(--dif); background: color-mix(in srgb, var(--dif) 13%, transparent); }
.cambios { font: 12px var(--mono); white-space: nowrap; }
.cambios .mas { color: var(--add); } .cambios .menos { color: var(--del); }
.flecha { color: var(--faint); width: 12px; flex: none; transition: transform .12s; }
.fila.abierta .flecha { transform: rotate(90deg); }
.vacia { padding: 22px 16px; color: var(--muted); }

.diff { margin: 0; padding: 8px 0; font: 12px/1.5 var(--mono); background: var(--panel2); border-bottom: 1px solid var(--line); overflow-x: auto; }
.diff span { display: block; padding: 0 16px; white-space: pre; min-width: max-content; }
.diff .add { background: var(--add-bg); color: var(--add); }
.diff .del { background: var(--del-bg); color: var(--del); }
.diff .hunk { color: var(--faint); padding-top: 6px; }
.leyenda-diff { font-size: 12px; color: var(--muted); padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.leyenda-diff b.del { color: var(--del); } .leyenda-diff b.add { color: var(--add); }

.tag {
  --c: var(--c-TABLA);
  display: inline-block; font: 600 10.5px/1 system-ui, sans-serif; letter-spacing: .03em;
  padding: 3px 5px; border-radius: 4px; flex: none; text-align: center; min-width: 40px;
  color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
}
.t-TABLA { --c: var(--c-TABLA); } .t-VISTA { --c: var(--c-VISTA); } .t-PROC { --c: var(--c-PROC); }
.t-FUNCION { --c: var(--c-FUNCION); } .t-TRIGGER { --c: var(--c-TRIGGER); }
.t-SINONIMO { --c: var(--c-SINONIMO); } .t-SECUENCIA { --c: var(--c-SECUENCIA); } .t-JOB { --c: var(--c-JOB); }

.marca-agua {
  position: fixed; right: 18px; bottom: 14px; z-index: 5; pointer-events: none;
  display: flex; align-items: center; gap: 6px; opacity: .55; color: #2b6cb7; font-size: 11.5px; font-weight: 600;
}
.marca-agua svg { width: 34px; height: 34px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .marca-agua { color: #6aa2e8; } }
:root[data-theme="dark"] .marca-agua { color: #6aa2e8; }

@media (max-width: 760px) {
  main { padding: 16px 16px 72px; }
  .lados { grid-template-columns: 1fr; }
  .caja.resumen { overflow-x: auto; }
  .fila .fechas { display: none; }
}
</style>

en selecting result for SAP and updating the prod table\n+-- 0.02.00\tMC\t\t\t2025-12-02\t\t\tRebuilding procedure for aggregate reporting to SAP\n -- ===========================================================================================\n-\n-\n-CREATE         PROCEDURE [dbo].[sp_s_ei_gr_against_obd] as\n-begin\n-\n-\tDeclare @row_id int,@wo_id varchar(100),@state_cd int,@qty_prod float,@qty_prod_erp float,@gr_count int,@ent_id int,@to_ent_id int, @good_prod BIT\n-\tDeclare  @error_msg NVARCHAR(500), @error_severity INT,@error_state INT,@attr_id INT,@mod_id varchar(30),@storage_locn VARCHAR(100)\n-\tDeclare @plant_code varchar(100),@reas_cd INT,@mov_type varchar(10)\n-\tDeclare @gragainstobd nvarchar(5),@delivery nvarchar(20),@process_id nvarchar(100),@reportProd nvarchar(50)\n+--execute [dbo].[sp_s_ei_gr_against_obd_new]\n+\n+CREATE  \tPROCEDURE [dbo].[sp_s_ei_gr_against_obd] as\n+BEGIN\n+\tDECLARE @lot_no NVARCHAR(40),\n+\t\t@item_id NVARCHAR(40),\n+\t\t@wo_id NVARCHAR(40),\n+\t\t@plant_code NVARCHAR(40),\n+\t\t@attr_id INT,\n+\t\t@mod_id VARCHAR(30),\n+\t\t@gr_count INT,\n+\t\t@row_id INT,\n+\t\t@storage_locn NVARCHAR(10),\n+\t\t@move_type NVARCHAR(10)\n+\tDeclare  @error_msg NVARCHAR(500), @error_severity INT,@error_state INT\n+    DECLARE @delay_hours INT = -1; -- report data older than @delay_hours\n+\tDECLARE @cutoff_date DATETIME; -- time threshold for data selection\n+\tDECLARE @frequency_hours INT = 0;\t--  report data every X hours for each batch\n+\tDECLARE @interface NVARCHAR(40) = 'GR_OBD' --ei interface name\n+\n+\tDECLARE @_buffer_table TABLE\n+\t(\n+\trow_id INT,\n+\two_id NVARCHAR(40),\n+\titem_id NVARCHAR(40),\n+\tuom NVARCHAR(40),\n+\titem_puo_doc NVARCHAR(100),\n+\tdelivery_item NVARCHAR(40),\n+\tdelivery NVARCHAR(40),\n+\tent_id INT,\n+\tto_ent_id INT,\n+\treas_desc NVARCHAR(80),\n+\tstorage_locn NVARCHAR(10),\n+\tmove_type NVARCHAR(10),\n+\tprocess_id NVARCHAR(40),\n+\tgood_prod BIT,\n+\tqty_to_report DECIMAL(18,3),\n+\tlot_no NVARCHAR(40),\n+\tcreated_at_utc DATETIME,\n+\tcreated_at_local DATETIME\n+\t)\n+\n \tSET NOCOUNT ON\n \n \tBEGIN TRY\n-\tBEGIN Transaction\n-\n-\t\t--[WO state] 0 = Released, 1 = Started, 2 = Completed, 3 = Closed\n-\n-\t\tSET @row_id = -1;\n-\t\tSET @ent_id = -1;\n+\tBEGIN TRANSACTION\n+\n+\t\t--STEP1: Calculate cutoff time\n+        SET @cutoff_date = DATEADD(HOUR, DATEDIFF(HOUR, 0, DATEADD(HOUR, -@delay_hours, GETUTCDATE())), 0);\n \t\tSET @plant_code = ''\n-\n-\t\tSelect top 1 @row_id = ip.row_id, @wo_id = ip.wo_id,@ent_id = ip.ent_id,@to_ent_id = ip.to_ent_id, @reas_cd = ip.reas_cd,@process_id=w.process_id,\n-\t\t@good_prod = ip.good_prod from item_prod ip with (nolock)\n-\t\tinner join ofi_wo_ext wo_ext with (nolock) on ip.wo_id = wo_ext.wo_id and wo_ext.module = 'PO'\n-\t\tinner join wo w with (nolock) on w.wo_id = wo_ext.wo_id\n-\t\t--inner join ofi_wo_ext owe with(nolock) on owe.wo_id=w.wo_id -- 0.01.03\n-\t\twhere ip.qty_prod > ip.qty_prod_erp  --and owe.delivery is not null -- 0.01.03\n-\t\t-- 0.01.06\n-\t\tif EXISTS (select process_attr.attr_value from wo with(nolock) inner join process_attr with(nolock) on wo.process_id=process_attr.process_id\n-\t\t\t\twhere wo.wo_id=@wo_id and process_attr.attr_id=(select attr_id from attr with(nolock)where attr_desc='ReportProductionToSAP'))\n-\t\t\t\t\tbegin\n-\t\t\t\t\tselect @reportProd=process_attr.attr_value from wo with(nolock) inner join process_attr with(nolock) on wo.process_id=process_attr.process_id\n-\t\t\t\t\twhere wo.wo_id=@wo_id and process_attr.attr_id=(select attr_id from attr with(nolock)where attr_desc='ReportProductionToSAP')\n-\t\t\t\t\tIF(@reportProd='No')\n-\t\t\t\t\tBEGIN\n-\t\t\t\t\t    update item_prod set qty_prod_erp=qty_prod where row_id=@row_id\n-\t\t\t\t\t\tSET @row_id = -1;\n-\t\t\t\t\t\tSET @ent_id=-1;\n-\t\t\t\t\t\tEND\n-\t\t\t\t\tend\n-\t\t-- 0.01.03\n-\t\tif EXISTS (select process_attr.attr_value from wo with(nolock) inner join process_attr with(nolock) on wo.process_id=process_attr.process_id\n-\t\t\t\twhere wo.wo_id=@wo_id and process_attr.attr_id=(select attr_id from attr with(nolock)where attr_desc='GRAgainstOBD'))\n-\t\t\t\tbegin\n-\t\t\t\t\tselect @gragainstobd= process_attr.attr_value from wo with(nolock) inner join process_attr with(nolock) on wo.process_id=process_attr.process_id\n-\t\t\t\t\twhere wo.wo_id=@wo_id and process_attr.attr_id=(select attr_id from attr with(nolock)where attr_desc='GRAgainstOBD')\n-\n-\t\t\t\t\t--fetching next record where obd exist.\n-\t\t\t\t\tSelect top 1 @row_id = ip.row_id, @wo_id = ip.wo_id,@ent_id = ip.ent_id,@to_ent_id = ip.to_ent_id, @reas_cd = ip.reas_cd,@process_id=w.process_id,\n-\t\t\t\t\t@good_prod = ip.good_prod from item_prod ip with (nolock)\n-\t\t\t\t\tinner join ofi_wo_ext wo_ext with (nolock) on ip.wo_id = wo_ext.wo_id and wo_ext.module = 'PO'\n-\t\t\t\t\tinner join wo w with (nolock) on w.wo_id = wo_ext.wo_id\n-\t\t\t\t\tinner join ofi_wo_ext owe with(nolock) on owe.wo_id=w.wo_id -- 0.01.03\n-\t\t\t\t\twhere ip.qty_prod > ip.qty_prod_erp  and owe.delivery is not null and w.process_id=@process_id-- 0.01.03\n-\n-\t\t\t\t\tselect @delivery=delivery from ofi_wo_ext with(nolock) where wo_id=@wo_id\n-\t\t\t\t\tif (@gragainstobd='1' and @delivery is null)\n-\t\t\t\t\tbegin\n-\t\t\t\t\t\tSET @row_id = -1;\n-\t\t\t\t\tend\n-\n-\t\t\t\t end\n-\n-\n-\t\tif @ent_id \u003c> -1 and @ent_id is not NULL\n-\t\tBegin\n-\t\t\tSET @storage_locn = NULL\n-\t\t\tSELECT @storage_locn = attr_value from ent_attr with (nolock) where ent_id = @to_ent_id and attr_id = (Select attr_id from attr with (nolock) where attr_desc = 'SAPLocation')\n-\t\t\tIF @storage_locn is NULL\n-\t\t\t\tSELECT @storage_locn = ent_name from ent with (nolock) where ent_id = CASE WHEN @good_prod = 0 THEN @to_ent_id ELSE @ent_id END\n-\n-\t\t\tSET @mov_type = '101'\n-\t\tEnd\n-\n-\t\tSELECT @plant_code = attr_value from system_attr with (nolock) where attr_desc = 'PlantCode'\n-\n-\t\tif @reas_cd = (Select top 1 reas_cd from item_reas with (nolock) where reas_desc = 'Transit Loss')\n-\t\tBegin\n-\t\t\tSET @storage_locn = 'TL01'\n-\t\t\tSET @mov_type = 'Z03' ---(KN - 20Feb23 - SAP confirmed that the movement type for Transit Loss is z03)\n-\t\tEnd\n-\n-\t\tif @reas_cd = (Select top 1 reas_cd from item_reas with (nolock) where reas_desc = 'Transit Gain') --0.01.04\n-\t\tBegin\n-\t\t\tSET @storage_locn = 'TL01'\n-\t\t\tSET @mov_type = '701' ---(LK - 18Feb24 - SAP confirmed that the movement type for Transit Gain is 701)\n-\t\tEnd\n-\n-\t\tIF @row_id \u003c> -1 and @row_id is not nULL\n-\t\tBegin\n-\t\t\tSelect @state_cd = state_cd from wo with (nolock) where wo_id = @wo_id\n-\t\t\tSelect @qty_prod = sum(qty_prod), @qty_prod_erp = sum(qty_prod_erp) from item_prod with (nolock) where wo_id = @wo_id and row_id \u003c> @row_id group by wo_id\n-\t\t\tSelect @attr_id = attr_id from attr with (nolock) where attr_desc = 'GR_Against_OBD_Messages_Count'\n-\n-\t\t\t--0.01.07 Select qty values to variables to lock the value for update the table\n-\t\t\tSELECT @qty_prod=qty_prod, @qty_prod_erp=qty_prod_erp FROM item_prod WHERE row_id=@row_id\n-\n-\t\t\tSelect Format((GETDATE()),'yyyyMMdd') File_Generation_Date, Format(ip.created_at_local,'yyyyMMdd') Posting_Date,\n-\t\t\t'000000' File_Generation_Time, --Format((ip.last_edit_at),'hhmmss')\n-\t\t\tip.wo_id Document_Number,'' Message,ip.item_id Material_Number,\n-\t\t\t--wo_ext.delivery_item Delivery_Item,\n-\t\t\tRIGHT(wo_ext.delivery_item,len(wo_ext.delivery_item)-2) Delivery_Item, --KN 15/02/23 Updated to send only last 4 digits of delivery item as requested by SAP team + confirmed by AVEVA\n-\t\t\two_ext.delivery Delivery_Number,\n-\t\t\t--iif(@qty_prod = @qty_prod_erp and @state_cd >= 2,0,@qty_prod - @qty_prod_erp) Delivery_Quantity, --If Completed then send 0, else send the quantity produced\n-\t\t\t--qty_prod Delivery_Quantity,-- (KN 20-Feb-23 - Since the above condn is not handling waste reporting)\n-\t\t\tROUND((@qty_prod - @qty_prod_erp),3) Delivery_Quantity, -- (KN 12-Apr-23 - Modified to report only the diff. Decision based on testing with Yoga/Mahesh)\n-\t\t\tu.description BaseUnit_of_Measure,wo_ext.lot_no Batch_Number, ip.wo_id DocumentNumber_of_TheReferenceDocument,\n-\t\t\two_ext.item_no_puo_doc ItemNumber_of_TheReferenceItem,\n-\t\t\t@plant_code Plant,@storage_locn Storage_Location, @mov_type Movement_Type,\n-\t\t\t'B' Movement_Indicator, -- KN 03/01/23 Changed from L to B as requested by SAP team -- KN 15/02/23 Changed from B to L, again L to B as requested by SAP team\n-\t\t\tiif(@storage_locn = 'TL01','C','') DeliveryCompleted_Indicator\n-\t\t\tfrom item_Prod  ip with (nolock)\n-\t\t\tinner join item i with (nolock) on ip.item_id = i.item_id\n-\t\t\tinner join item_class ic with (nolock) on ic.item_class_id = i.item_class_id\n-\t\t\tleft join uom u with (nolock) on i.uom_id = u.uom_id\n-\t\t\tleft join ofi_wo_ext wo_ext with (nolock) on wo_ext.wo_id = ip.wo_id\n-\t\t\twhere ip.row_id = @row_id and ic.item_class_desc = 'Raw Materials' --Send only raw materials as this interface is sent for Liquid liquor intake, Liquid butter intake and Additive intake\n-\n-\t\t\t--Now increase the GR_Against_OBD_Messages_Count attribute value\n-\n-\t\t\tIf not exists(SELECT wo_id FROM wo_attr WITH (NOLOCK) WHERE wo_id = @wo_id AND attr_id = @attr_id)\n-\t\t\t\tExec sp_I_Wo_Attr @wo_id,@attr_id,1,'','',@mod_id OUT\n-\t\t\telse\n-\t\t\t\tbegin\n-\t\t\t\t\tSelect @gr_count = attr_value,@mod_id = mod_id from wo_attr with (nolock) where wo_id = @wo_id and attr_id = @attr_id\n-\t\t\t\t\tSet @gr_count = @gr_count + 1\n-\n-\t\t\t\t\tupdate wo_attr set attr_value = @gr_count where wo_id = @wo_id and attr_id = @attr_id\n-\n-\t\t\t\t\t--Exec sp_U_Wo_Attr @wo_id,@attr_id,@gr_count,'','',@mod_id\n-\t\t\t\tend\n-\t\t\t--0.01.07 use variable @qty_prod instead of qty_prod (table value)\n-\t\t\tUpdate item_prod set qty_prod_erp = @qty_prod where row_id = @row_id\n-\t\tEnd\n-\n-\t\tCommit Transaction\n-\n-\tEnd TRY\n-\n+\t\tSELECT @plant_code = attr_value FROM system_attr WITH (NOLOCK) WHERE attr_desc = 'PlantCode'\n+\t\tSELECT @attr_id = attr_id FROM attr WITH (NOLOCK) WHERE attr_desc = 'GR_Against_OBD_Messages_Count'\n+\t\t--STEP2: insert cantidates\n+\t\tINSERT INTO @_buffer_table(\n+\t\t\trow_id,\n+\t\t\two_id,\n+\t\t\titem_id,\n+\t\t\tuom,\n+\t\t\titem_puo_doc,\n+\t\t\tdelivery_item,\n+\t\t\tdelivery,\n+\t\t\tent_id,\n+\t\t\tto_ent_id,\n+\t\t\treas_desc,\n+\t\t\tstorage_locn,\n+\t\t\tmove_type,\n+\t\t\tprocess_id,\n+\t\t\tgood_prod,\n+\t\t\tqty_to_report,\n+\t\t\tlot_no,\n+\t\t\tcreated_at_utc,\n+\t\t\tcreated_at_local\n+\t\t)\n+\t\tSELECT\n+\t\t\tip.row_id,\n+\t\t\tip.wo_id,\n+\t\t\tip.item_id,\n+\t\t\tuom.description,\n+\t\t\twe.item_no_puo_doc,\n+\t\t\twe.delivery_item,\n+\t\t\twe.delivery,\n+\t\t\tip.ent_id,\n+\t\t\tip.to_ent_id,\n+\t\t\tir.reas_desc,\n+\t\t\tCASE WHEN ir.reas_desc='Transit Loss' OR ir.reas_desc='Transit Gain' THEN 'TL01'\n+\t\t\t\tWHEN sl.attr_value IS NOT NULL THEN sl.attr_value\n+\t\t\t\tWHEN ip.good_prod = 0 THEN e2.ent_name\n+\t\t\t\tELSE e1.ent_name\n+\t\t\tEND AS storage_locn,\n+\t\t\tCASE WHEN ir.reas_desc='Transit Loss' THEN 'Z03'\n+\t\t\t\tWHEN ir.reas_desc='Transit Gain' THEN '701' ELSE '101' END AS move_type,\n+\t\t\tw.process_id,\n+\t\t\tip.good_prod,\n+\t\t\tCONVERT(DECIMAL(18,3), ip.qty_prod - ip.qty_prod_erp),\n+\t\t\twe.lot_no,\n+\t\t\tip.created_at_utc,\n+\t\t\tip.created_at_local\n+\t\tFROM item_prod ip WITH (NOLOCK)\n+\t\tJOIN ofi_wo_ext we WITH (NOLOCK) ON ip.wo_id=we.wo_id and we.module='PO'\n+\t\tJOIN job j WITH (NOLOCK) ON j.wo_id=ip.wo_id and j.seq_no=ip.seq_no\n+\t\tJOIN wo w WITH (NOLOCK) ON w.wo_id=we.wo_id\n+\t\tJOIN item i WITH (NOLOCK) ON i.item_id=ip.item_id\n+\t\tJOIN uom WITH (NOLOCK) ON uom.uom_id=i.uom_id\n+\t\tJOIN item_class ic WITH (NOLOCK) ON ic.item_class_id=i.item_class_id\n+\t\tJOIN ent e1 WITH (NOLOCK) ON e1.ent_id = ip.ent_id\n+\t\tJOIN ent e2 WITH (NOLOCK) ON e2.ent_id = ip.to_ent_id\n+\t\tLEFT JOIN\n+\t\t\t(SELECT\n+\t\t\tprocess_attr.attr_value, wo.wo_id\n+\t\t\tFROM wo WITH (NOLOCK)\n+\t\t\tJOIN process_attr WITH (NOLOCK) ON wo.process_id=process_attr.process_id\n+\t\t\tWHERE process_attr.attr_id=(SELECT attr_id FROM attr WITH (NOLOCK) WHERE attr_desc='ReportProductionToSAP')\n+\t\t\t) rp\n+\t\t\tON rp.wo_id = w.wo_id\n+\t\tLEFT JOIN\n+\t\t\t(\n+\t\t\tSELECT process_attr.attr_value, wo.wo_id\n+\t\t\tFROM wo WITH (NOLOCK)\n+\t\t\tJOIN process_attr WITH (NOLOCK) ON wo.process_id=process_attr.process_id\n+\t\t\tWHERE process_attr.attr_id=(SELECT attr_id FROM attr WITH (NOLOCK) WHERE attr_desc='GRAgainstOBD')\n+\t\t\t) gr\n+\t\t\tON gr.wo_id = w.wo_id\n+\t\tLEFT JOIN\n+\t\t\t(\n+\t\t\tSELECT attr_value, ent_id FROM ent_attr WITH (NOLOCK)\n+\t\t\tWHERE attr_id = (SELECT attr_id FROM attr WITH (NOLOCK) WHERE attr_desc = 'SAPLocation')\n+\t\t\t) sl ON sl.ent_id = ip.to_ent_id\n+\t\tLEFT JOIN item_reas ir WITH (NOLOCK)\n+\t\t\tON ip.reas_cd=ir.reas_cd\n+\t\tLEFT JOIN ofi_ei_interface_last_execution ile ON ile.wo_id=ip.wo_id AND ile.lot_no=we.lot_no AND ile.item_id=ip.item_id AND ile.interface=@interface\n+\t\tWHERE\n+\t\t\tCONVERT(DECIMAL(18,3), ip.qty_prod) > CONVERT(DECIMAL(18,3), ip.qty_prod_erp)\n+\t\t\tAND ip.created_at_utc \u003c @cutoff_date\n+\t\t\tAND (rp.attr_value IS NOT NULL AND rp.attr_value='Yes' OR rp.attr_value IS NULL)\n+\t\t\tAND (gr.attr_value IS NOT NULL AND gr.attr_value='1' AND we.delivery IS NOT NULL OR gr.attr_value IS NULL)\n+\t\t\tAND ic.item_class_desc = 'Raw Materials'\n+\t\t\tAND j.state_cd \u003c> 3 --do not send obd for running job to avoid locking in SAP\n+\t\t\tAND (ile.last_sent_at IS NULL OR ile.last_sent_at \u003c DATEADD(hour,-@frequency_hours,GETDATE()))\n+\n+\t\tIF @@ROWCOUNT > 0\n+\t\tBEGIN\n+\t\t\t--STEP3: Select the oldest production group to report\n+            SELECT TOP 1\n+                @wo_id = wo_id,\n+                @lot_no = lot_no,\n+                @item_id = item_id,\n+\t\t\t\t@storage_locn = storage_locn,\n+\t\t\t\t@move_type = move_type\n+            FROM  bt.item_id = @item_id AND bt.storage_locn = @storage_locn AND bt.move_type = @move_type\n+\n+\t\t\t--STEP7: Update last execution table\n+\t\t\tSELECT @row_id=id from ofi_ei_interface_last_execution WHERE interface = @interface AND wo_id=@wo_id AND lot_no=@lot_no AND item_id=@item_id\n+\n+\t\t\tIF @row_id IS NOT NULL --if already exist update timestamp\n+\t\t\t\tUPDATE dbo.ofi_ei_interface_last_execution\n+\t\t\t\tSET last_sent_at = GETDATE()\n+\t\t\t\tWHERE id = @row_id;\n+\t\t\tELSE -- else create new record\n+\t\t\t\tINSERT INTO ofi_ei_interface_last_execution (wo_id, lot_no, item_id, interface, last_sent_at)\n+\t\t\t\tVALUES (@wo_id, @lot_no, @item_id, @interface, GETDATE())\n+\t\tEND\n+\tCOMMIT TRANSACTION\n+\tEND TRY\n \tBEGIN CATCH\n \t\tIF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;\n \t\tSELECT @error_msg = Error_message(),@error_severity = Error_severity(),@error_state = Error_state();\n \t\tRAISERROR(@error_msg,@error_severity,@error_state)\n \tEND CATCH\n-\n-end\n+END","mas":193,"menos":110},{"t":"PROC","n":"dbo.sp_s_ei_inv_reclass","ma":"2026-06-29","mb":"2025-12-08","e":"distinto","d":"@@ -15,17 +15,15 @@\n -- 0.01.06\tMC\t\t\t2025-08-08\t\t\tAdded condition to take only PuO with delivery\n -- 0.01.07\tMC\t\t\t2025-10-28\t\t\tReport reclassification only for SAP wo\n -- 0.01.08\tMC\t\t\t2025-12-03\t\t\tVerification if there is enough production reported to SAP\n--- 0.01.09\tMC\t\t\t2026-02-20\t\t\tFixed issue with reported qty verification\n--- 0.01.10  AML, XPM    2026-06-29\t\t\tFilter out 'T' traceability sublots\n -- ===========================================================================================\n \n -- exec [dbo].[sp_s_ei_inv_reclass_new]\n-CREATE     PROCEDURE [dbo].[sp_s_ei_inv_reclass] as\n+CREATE   PROCEDURE [dbo].[sp_s_ei_inv_reclass] as\n begin\n \n SET NOCOUNT ON\n \n-DECLARE @trans_id int, @plant_code varchar(40), @qty_to_report DECIMAL(18,3)\n+DECLARE @trans_id int, @plant_code varchar(40), @qty_to_report float\n \n --(KN 27Jun23) ns_sublot_no = at.sub_lot_no,\n+\t\t\t\t\t\t@qty_left = at.qty,\n+\t\t\t\t\t\t@item_id = at.item_id,\n+\t\t\t\t\t\t@grade_cd = iv.grade_cd,\n+\t\t\t\t\t\t@status_cd = iv.status_cd,\n+\t\t\t\t\t\t@uom_desc = u.abbreviation\n+\t\t\t\t\tFROM @TempInv at\n+\t\t\t\t\t\tLEFT JOIN item_inv iv WITH (NOLOCK)\n+\t\t\t\t\t\t\tON at.row_id = iv.row_id\n+\t\t\t\t\t\tLEFT JOIN uom u WITH (NOLOCK)\n+\t\t\t\t\t\t\tON iv.uom_id = u.uom_id\n+\t\t\t\t\tWHERE id = @iterate\n+\n+\t\t\t\t\tEXEC @return_value = [dbo].[sp_I_Item_Cons_AddConsDirect]\n+\t\t\t\t\t\t@from_ent_id = @ent_id,\n+\t\t\t\t\t\t@item_id = @item_id,\n+\t\t\t\t\t\t@lot_no = @cons_lot_no,\n+\t\t\t\t\t\t@sublot_no = @cons_sublot_no,\n+\t\t\t\t\t\t@qty_cons = @qty_left,\n+\t\t\t\t\t\t@reas_cd = @intGoodConsReas,\n+\t\t\t\t\t\t@grade_cd = @grade_cd,\n+\t\t\t\t\t\t@status_cd = @status_cd,\n+\t\t\t\t\t\t@user_id = @user_id,\n+\t\t\t\t\t\t@wo_id = NULL, --0.05.00 - to be implemented after CR00186839 implementing\n+\t\t\t\t\t\t@oper_id = NULL, --0.05.00 - to be implemented after CR00186839 implementing\n+\t\t\t\t\t\t@seq_no = NULL, --0.05.00 - to be implemented after CR00186839 implementing\n+\t\t\t\t\t\t@shift_start_local = NULL,\n+\t\t\t\t\t\t@fg_lot_no = @fg_lot_no, --0.05.00\n+\t\t\t\t\t\t@fg_sublot_no = @fg_sublot_no, --0.05.00\n+\t\t\t\t\t\t@item_scrapped = 1,\n+\t\t\t\t\t\t@ent_id = @target_sched_ent_id, --0.05.00\n+\t\t\t\t\t\t@shift_id = NULL,\n+\t\t\t\t\t\t@qty_cons_erp = NULL,\n+\t\t\t\t\t\t@ext_ref = NULL,\n+\t\t\t\t\t\t@transaction_type = NULL,\n+\t\t\t\t\t\t@genealogy_id = NULL,\n+\t\t\t\t\t\t@upstream_event_id = NULL,\n+\t\t\t\t\t\t@segment_requirement_id = NULL,\n+\t\t\t\t\t\t@segment_response_id = NULL,\n+\t\t\t\t\t\t@comments = 'Trigger with Low Signal, Scrap due to ForceScrapOnLowLevel attribute',\n+\t\t\t\t\t\t@spare1 = NULL,\n+\t\t\t\t\t\t@spare2 = NULL,\n+\t\t\t\t\t\t@spare3 = NULL,\n+\t\t\t\t\t\t@spare4 = NULL,\n+\t\t\t\t\t\t@shift_start_utc = NULL,\n+\t\t\t\t\t\t@time_zone_bias_value = NULL,\n+\t\t\t\t\t\t@row_id = @row_id OUTPUT\n+\n+\t\t\t\t\t--00.06.00\n+\t\t\t\t\tDELETE FROM item_inv where ent_id = @ent_id AND qty_left \u003c= 0\n+\n+\t\t\t\t\tIF (@audit_trail = 1)\n+\t\t\t\t\tBEGIN\n+\t\t\t\t\t\tDELETE @auditTrailParameters;\n+\t\t\t\t\t\tSET @strCommentMsg = 'Scrap due to ForceScrapOnLowLevel attribute - Silo Name :' + @SU_Name\n+\t\t\t\t\t\t\t+ ', Reduced Qty :' + CAST(@qty_left AS varchar) + ' ' + @uom_desc\n+\n+\t\t\t\t\t\tINSERT INTO @auditTrailParameters\n+\t\t\t\t\t\t\t(row_id, field_name, field_value)\n+\t\t\t\t\t\tVALUES\n+\t\t\t\t\t\t\t(@row_id, '@EntId', CONVERT(NVARCHAR(80), @ent_id)),\n+\t\t\t\t\t\t\t(@row_id, '@ItemId', CONVERT(NVARCHAR(80), @item_id)),\n+\t\t\t\t\t\t\t(@row_id, '@LotNo', CONVERT(NVARCHAR(80), @cons_lot_no)),\n+\t\t\t\t\t\t\t(@row_id, '@SublotNo', CONVERT(NVARCHAR(80), @cons_sublot_no)),\n+\t\t\t\t\t\t\t(@row_id, '@ReducedQty', CONVERT(NVARCHAR(80), @qty_left)),\n+\t\t\t\t\t\t\t(@row_id, '@GradeCd', CONVERT(NVARCHAR(80), @grade_cd)),\n+\t\t\t\t\t\t\t(@row_id, '@StateCd', CONVERT(NVARCHAR(80), @status_cd))\n+\n+\t\t\t\t\t\tEXEC sp_I_ofi_AuditTrail\n+\t\t\t\t\t\t\t\t@module_id = @strModuleName,\n+\t\t\t\t\t\t\t\t@function_id = @strFunctionName,\n+\t\t\t\t\t\t\t\t@auditTrailParameters = @auditTrailParameters,\n+\t\t\t\t\t\t\t\t@user_id = @user_name,\n+\t\t\t\t\t\t\t\t@activity = @strActivityMsg,\n+\t\t\t\t\t\t\t\t@audit_category = 'Info',\n+\t\t\t\t\t\t\t\t@comments = @strCommentMsg\n+\t\t\t\t\tEND\n+\n+\t\t\t\t\tSET @iterate = @iterate + 1\n+\t\t\t\tEND\n+\t\t\tEND\n+\n+\t\t\tSET @Out = 0\n+\n+\t\t\tSELECT\n+\t\t\t\t@Out AS [Out],\n+\t\t\t\t@ent_id AS EntId,\n+\t\t\t\t@wo_id AS WoId\n+\t\t\tRETURN\n+\t\tEND\n+\t\t-- [/0.07.00]\n+\n+\t\t-- 0.08.01 determine last interface (consumption or stock transfer)\n+\t\tSELECT @last_cons_time = MAX(ic_max.last_edit_at), @last_trans_time = MAX(it_max.last_transfer_at)\n+\t\tFROM item_inv iv WITH (NOLOCK)\n+\t\tLEFT JOIN\n+\t\t\t(SELECT item_id , lot_no, from_ent_id, grade_cd, MAX(last_edit_at) AS last_edit_at\n+\t\t\tFROM item_cons WITH (NOLOCK)\n+\t\t\tWHERE wo_id IS NOT NULL\n+\t\t\tGROUP BY item_id, lot_no, from_ent_id, grade_cd\n+\t\t\t) AS ic_max\n+\t\t\tON iv.item_id=ic_max.item_id\n+\t\t\tAND iv.lot_no=ic_max.lot_no\n+\t\t\tAND iv.ent_id=ic_max.from_ent_id\n+\t\t\tAND iv.grade_cd=ic_max.grade_cd\n+\t\tLEFT JOIN\n+\t\t\t(SELECT item_id, lot_no, from_ent_id, MAX(transfer_time_utc) as last_transfer_at\n+\t\t\tFROM item_transfer WITH (NOLOCK)\n+\t\t\tWHERE to_ent_id\u003c>from_ent_id and comments like 'Stock Transfer%'\n+\t\t\tGROUP BY item_id, lot_no, from_ent_id\n+\t\t\t) AS it_max\n+\t\t\tON iv.lot_no=it_max.lot_no\n+\t\t\t--AND iv.item_id=it_max.item_id\n+\t\t\tAND iv.ent_id=it_max.from_ent_id\n+\t\tWHERE iv.ent_id=@ent_id\n+\n+\t\tIF @last_cons_time IS NOT NULL AND @last_trans_time IS NOT NULL\n+\t\tBEGIN\n+\t\t\tIF @last_cons_time > @last_trans_time SET @is_transfer=0\n+\t\t\tELSE Set @is_transfer=1\n+\t\tEND\n+\t\tELSE IF @last_cons_time IS NOT NULL SET @is_transfer=0\n+\t\tELSE IF @last_trans_time IS NOT NULL SET @is_transfer=1\n+\t\tELSE SET @is_transfer=NULL\n+\t\tprint 'transfer -' + CONVERT(NVARCHAR(1),@is_transfer)\n+\t\tIF @is_transfer = 1-- if transfer was last consuming action\n+\t\tBEGIN\n+\t\t\tprint 'last interface: transfer'\n+\t\t\tSELECT TOP(1)\n+\t\t\t\t@item_id = iv.item_id,\n+\t\t\t\t@wo_id = it_max.wo_id,\n+\t\t\t\t@trans_status = tss.transfer_status_cd,\n+\t\t\t\t@trans_ent_id = tss.ent_id,\n+\t\t\t\t@cons_ent_id = it_max.from_ent_id,\n+\t\t\t\t@dest_ent_name = it_max.ent_name,\n+\t\t\t\t@dest_item_id =it_max.item_id,\n+\t\t\t\t@dest_grade_desc = it_max.item_grade_desc,\n+\t\t\t\t@dest_status = it_max.item_status_desc\n+\t\t\tFROM item_inv iv WITH (NOLOCK)\n+\t\t\tLEFT JOIN\n+\t\t\t(SELECT ii.item_id, it.from_item_id, ig.item_grade_desc, ist.item_status_desc, it.wo_id, it.lot_no, from_ent_id, to_ent_id, e.ent_name, MAX(transfer_time_utc) as last_transfer_at\n+\t\t\t\tFROM item_transfer it WITH (NOLOCK)\n+\t\t\t\tJOIN ent e WI 003c= @Counter)\n+\t\t\t\t\tBEGIN\n+\t\t\t\t\t\tSELECT\n+\t\t\t\t\t\t\t@cons_lot_no = at.lot_no,\n+\t\t\t\t\t\t\t@cons_sublot_no = at.sub_lot_no,\n+\t\t\t\t\t\t\t@qty_left = at.qty,\n+\t\t\t\t\t\t\t@item_id = at.item_id,\n+\t\t\t\t\t\t\t@grade_cd = iv.grade_cd,\n+\t\t\t\t\t\t\t@grade_desc = ig.item_grade_desc,\n+\t\t\t\t\t\t\t@status_cd = iv.status_cd,\n+\t\t\t\t\t\t\t@status = ist.item_status_desc,\n+\t\t\t\t\t\t\t@uom_desc = u.abbreviation\n+\t\t\t\t\t\tFROM @TempInv at\n+\t\t\t\t\t\t\tLEFT JOIN item_inv iv WITH (NOLOCK)\n+\t\t\t\t\t\t\t\tON at.row_id = iv.row_id\n+\t\t\t\t\t\t\tLEFT JOIN item_grade ig WITH (NOLOCK)\n+\t\t\t\t\t\t\t\tON iv.grade_cd=ig.item_grade_cd\n+\t\t\t\t\t\t\tLEFT JOIN uom u WITH (NOLOCK)\n+\t\t\t\t\t\t\t\tON iv.uom_id = u.uom_id\n+\t\t\t\t\t\t\tLEFT JOIN item_state ist WITH (NOLOCK)\n+\t\t\t\t\t\t\t\tON ist.item_status_cd=iv.status_cd\n+\t\t\t\t\t\tWHERE id = @iterate\n+\n+\t\t\t\t\t\tIF @item_id \u003c> @dest_item_id OR @grade_desc \u003c> @dest_grade_desc OR @status \u003c> @dest_status\n+\t\t\t\t\t\t\tSET @autoreclassify=1\n+\t\t\t\t\t\tELSE\n+\t\t\t\t\t\t\tSET @autoreclassify=0\n+\t\t\t\t\t\tprint 'execute transfer/ from_status:' + CONVERT(NVARCHAR(10),@status) + ' to_status:' + CONVERT(NVARCHAR(10),@dest_status)\n+\t\t\t\t\t\tEXEC @return_value = [dbo].[sp_U_ofi_st_RegisterTransferQty]\n+\t\t\t\t\t\t@from_ent_name = @SU_Name,\n+\t\t\t\t\t\t@from_site_name = 'Koog',\n+\t\t\t\t\t\t@to_ent_name = @dest_ent_name,\n+\t\t\t\t\t\t@to_site_name = 'Koog',\n+\t\t\t\t\t\t@item_id = @item_id,\n+\t\t\t\t\t\t@to_item_id = @dest_item_id,\n+\t\t\t\t\t\t@lot_no = @cons_lot_no,\n+\t\t\t\t\t\t@to_lot_no = @cons_lot_no,\n+\t\t\t\t\t\t@sublot_no = @cons_sublot_no,\n+\t\t\t\t\t\t@to_sublot_no = @cons_sublot_no,\n+\t\t\t\t\t\t@from_grade_desc = @grade_desc,\n+\t\t\t\t\t\t@to_grade_desc = @dest_grade_desc,\n+\t\t\t\t\t\t@from_status_desc = @status,\n+\t\t\t\t\t\t@to_status_desc = @dest_status,\n+\t\t\t\t\t\t@transfer_qty = @qty_left,\n+\t\t\t\t\t\t@transfer_qt <script>
'use strict';

const D = JSON.parse(document.getElementById('datos').textContent);
const TIPOS = {
  TABLA: ['Tables', 'TABLE'], VISTA: ['Views', 'VIEW'], PROC: ['Procedures', 'PROC'], FUNCION: ['Functions', 'FUNC'],
  TRIGGER: ['Triggers', 'TRIG'], SINONIMO: ['Synonyms', 'SYN'], SECUENCIA: ['Sequences', 'SEQ'], JOB: ['SQL Agent jobs', 'JOB'],
};
const ESTADOS = { soloA: 'Only in A', soloB: 'Only in B', distinto: 'Different' };
const fmt = new Intl.NumberFormat('en-US');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tag = t => `<span class="tag t-${t}">${TIPOS[t][1]}</span>`;

const filtro = { estado: 'todos', tipo: null, texto: '' };
const abiertos = new Set();

// ---------- cabecera y resumen ----------
$('generado').textContent = `${D.a.etiqueta}  vs  ${D.b.etiqueta}`;
$('lados').innerHTML = ['a', 'b'].map(l => `<div class="lado ${l}"><div class="letra">${l.toUpperCase()}</div>
  <div class="nombre">${esc(D[l].etiqueta)}</div><div class="fecha">Extracted ${esc(D[l].fecha)}</div></div>`).join('');
$('avisos').innerHTML = D.avisos.map(a => `<p>${esc(a)}</p>`).join('');

function celda(t, estado, n, clase) {
  if (!n) return `<td><span class="cero">0</span></td>`;
  const sel = filtro.tipo === t && filtro.estado === estado ? ' sel' : '';
  return `<td><button class="num ${clase}${sel}" data-t="${t}" data-e="${estado}">${fmt.format(n)}</button></td>`;
}
function pintarResumen() {
  const total = { a: 0, b: 0, soloA: 0, soloB: 0, distintos: 0, iguales: 0 };
  let html = `<tr><th>Type</th><th class="col-a">A</th><th class="col-b">B</th><th>Only in A</th><th>Only in B</th><th>Different</th><th>Identical</th></tr>`;
  for (const t of D.tipos) {
    const r = D.resumen[t];
    if (!r.a && !r.b) continue;
    for (const k in total) total[k] += r[k];
    html += `<tr><td>${tag(t)} ${TIPOS[t][0]}</td><td>${fmt.format(r.a)}</td><td>${fmt.format(r.b)}</td>
      ${celda(t, 'soloA', r.soloA, 'col-a')}${celda(t, 'soloB', r.soloB, 'col-b')}${celda(t, 'distinto', r.distintos, 'col-dif')}
      <td>${fmt.format(r.iguales)}</td></tr>`;
  }
  html += `<tr class="total"><td>Total</td><td>${fmt.format(total.a)}</td><td>${fmt.format(total.b)}</td><td>${fmt.format(total.soloA)}</td>
    <td>${fmt.format(total.soloB)}</td><td>${fmt.format(total.distintos)}</td><td>${fmt.format(total.iguales)}</td></tr>`;
  $('resumen').innerHTML = html;
}
$('resumen').addEventListener('click', e => {
  const b = e.target.closest('.num'); if (!b) return;
  const mismo = filtro.tipo === b.dataset.t && filtro.estado === b.dataset.e;
  filtro.tipo = mismo ? null : b.dataset.t;
  filtro.estado = mismo ? 'todos' : b.dataset.e;
  pintar();
  if (!mismo) $('lista').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ---------- lista ----------
function visibles() {
  const q = filtro.texto.trim().toLowerCase();
  return D.filas.filter(f => (filtro.estado === 'todos' || f.e === filtro.estado)
    && (!filtro.tipo || f.t === filtro.tipo) && (!q || f.n.toLowerCase().includes(q)));
}
function pintarEstados() {
  const n = e => D.filas.filter(f => (e === 'todos' || f.e === e) && (!filtro.tipo || f.t === filtro.tipo)).length;
  $('estados').innerHTML = [['todos', 'All'], ['soloA', 'Only in A'], ['soloB', 'Only in B'], ['distinto', 'Different']]
    .map(([e, t]) => `<button data-e="${e}" aria-pressed="${filtro.estado === e}">${t} (${fmt.format(n(e))})</button>`).join('');
  $('filtroTipo').innerHTML = filtro.tipo ? `Only ${TIPOS[filtro.tipo][0].toLowerCase()} <button id="quitarTipo" title="Show every type">✕</button>` : '';
}
function diffHTML(d) {
  return d.split('\n').map(l => {
    const c = l.startsWith('@@') ? 'hunk' : l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : '';
    return `<span class="${c}">${esc(l) || ' '}</span>`;
  }).join('');
}
function pintarLista() {
  const filas = visibles();
  if (!D.filas.length) { $('lista').innerHTML = '<p class="vacia">No differences: both databases have the same objects with the same code.</p>'; return; }
  if (!filas.length) { $('lista').innerHTML = '<p class="vacia">Nothing matches the filter.</p>'; return; }
  const partes = [];
  for (const f of filas) {
    const id = f.t + '|' + f.n;
    const abierta = abiertos.has(id);
    const fechas = [f.ma ? `A ${f.ma}` : '', f.mb ? `B ${f.mb}` : ''].filter(Boolean).join(' · ');
    const cambios = f.e === 'distinto' ? `<span class="cambios"><span class="mas">+${f.mas}</span> <span class="menos">−${f.menos}</span></span>` : '';
    partes.push(`<div class="fila${f.e === 'distinto' ? ' abrible' : ''}${abierta ? ' abierta' : ''}" data-id="${esc(id)}">
      <span class="flecha">${f.e === 'distinto' ? '▸' : ''}</span>${tag(f.t)}<span class="nom">${esc(f.n)}</span>
      <span class="estado ${f.e}">${ESTADOS[f.e]}</span>${cambios}<span class="fechas">${fechas ? 'modified ' + fechas : ''}</span></div>`);
    if (abierta) {
      partes.push(`<div class="leyenda-diff"><b class="del">−</b> only in A · <b class="add">+</b> only in B</div><pre class="diff">${diffHTML(f.d)}</pre>`);
    }
  }
  $('lista').innerHTML = partes.join('');
}
function pintar() { pintarResumen(); pintarEstados(); pintarLista(); }

$('estados').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filtro.estado = b.dataset.e; pintar();
});
$('filtroTipo').addEventListener('click', e => {
  if (e.target.id === 'quitarTipo') { filtro.tipo = null; pintar(); }
});
$('buscar').addEventListener('input', e => { filtro.texto = e.target.value; pintarLista(); });
$('lista').addEventListener('click', e => {
  const f = e.target.closest('.fila.abrible'); if (!f) return;
  const id = f.dataset.id;
  if (abiertos.has(id)) abiertos.delete(id); else abiertos.add(id);
  pintarLista();
});
$('copiar').addEventListener('click', async e => {
  const lineas = [['Type', 'Name', 'Status', 'Lines added', 'Lines removed', 'Modified in A', 'Modified in B'].join('\t'),
    ...visibles().map(f => [TIPOS[f.t][0], f.n, ESTADOS[f.e], f.mas ?? '', f.menos ?? '', f.ma || '', f.mb || ''].join('\t'))];
  const texto = lineas.join('\r\n');
  try { await navigator.clipboard.writeText(texto); }
  catch (err) { const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  const b = e.target, antes = b.textContent; b.textContent = 'Copied'; setTimeout(() => { b.textContent = antes; }, 1400);
});

pintar();
</script>
